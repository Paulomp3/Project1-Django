<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!-- link do font-awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com"><!--link da fonte principal do projeto-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@900&display=swap" rel="stylesheet">


    <title>Receitas</title>
</head>
<style>
    :root {
        /*conjunto de cores e fontes  que podemos usar no projeto */
        --color-primary: #269fe6;
        --color-primary-hover: #2086c2;
        --color-primary-dark: #13141f;
        --color-primary-dark-hover: #212336;
        --color-primary-light: #d4ecfa;
        --color-primary-light-hover: #bdd8e7;

        --color-white: #fff;
        --color-black: #000;

        --color-dark-text: #444;
        --color-info-light: #cce5ff;
        --color-debug-light: #cce5ff;
        --color-success-light: #d4edda;
        --color-alert-light: #fff3cd;
        --color-warning-light: #fff3cd;
        --color-error-light: #f8d7da;

        --color-info-dark: #4d86c4;
        --color-debug-dark: #4d86c4;
        --color-success-dark: #4a9c5d;
        --color-alert-dark: #927f40;
        --color-warning-dark: #927f40;
        --color-error-dark: #da525d;

        --color-gray-0: #f9f9f9;
        --color-gray-1: #e0e0e0;
        --color-gray-2: #c7c7c7;
        --color-gray-3: #aeaeae;
        --color-gray-4: #959595;
        --color-gray-5: #7d7d7d;
        --color-gray-6: #646464;
        --color-gray-7: #4b4b4b;
        --color-gray-8: #323232;
        --color-gray-9: #191919;

        --font-primary: sans-serif;
        --font-headings: 'Roboto Slab', serif;

        --spacing-gutter-low: 2rem;
        --spacing-gutter-medium: 3rem;
        --spacing-gutter-large: 4rem;
    }

    * {
        padding: 0;
        /*o padding serve para darmos respiros a espaços internos do layout */
        margin: 0;
        /*o margin serve para darmos respiros aos espaços externos do layout */
        box-sizing: border-box;
        /*ele tem a função de basicamente fazer os calculos dos espaços internos se adaptando  */
    }

    html {
        font-size: 90.5%;
        /*tamanho da fonte*/
    }

    body {
        font-size: 1.6rem;
        /*tamanho da fonte*/
        font-family: var(--font-primary);
        /*tipo da fonte*/
        background-color: var(--color-gray-1);
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        font-family: var(--font-headings)
            /*tipo da fonte para todos variaveis H*/
    }

    .main-header-container {
        /*container principal do header do nosso projeto*/
        background: var(--color-primary-dark-hover);
        /*cor do container principal*/
    }

    .header-container {
        max-width: 108rem;
        /*tamanho total da nossa largura*/
        background: var(--color-primary-dark-hover);
        /*cor do sub-container do header*/
        margin: 0 auto;
        /*altura */
        padding: var(--spacing-gutter-low);
    }

    .main-logo {
        font-size: 2rem;
        /*tamanho da fonte do nosso header*/
        color: var(--color-gray-0);
        /*cor da fonte do nosso header*/
        text-decoration: none;
        /*tirando o link que colocamos dentro de receitas*/
        display: flex;
        /*flexidade para o conteudo*/
        flex-flow: row nowrap;
        /*ajustes*/
        align-items: center;
        /*alinhamento ao centro*/
        justify-content: center;
        /*alinhamento do conteudo*/
        width: fit-content;
        /*para alterar o tamannho do nosso container*/
        margin: 0 auto;
        /*zerar os espaçamentos e assim ficar ajustado*/
    }

    .main-logo-icon {
        margin-right: 0.4rem;
        /*definir o tamanho entre o icone e o texto*/
    }


    /*Areá de busca*/

    .search-form {
        border: .2rem solid var(--color-primary-dark);
        max-width: 50rem;
        margin: 2rem auto;
        border-radius: .4rem;
        position: relative;
        transition: all 200ms ease-in-out;
    }

    .search-form:focus-within {
        border-color: var(--color-debug-dark);
        background-color: var(--color-white);

    }

    .search-form:focus-within .search-button {
        color: var(--color-debug-dark);
    }

    .search-input {
        width: 97%;
    }

    .search-button {
        position: absolute;
        top: 0;
        right: 0;
    }

    .search-button:focus {
        outline: 1px solid var(--color-primary-hover);
        background: rgba(0, 0, 0, .9);
    }


    .search-input,
    .search-button {
        border: none;
        background: none;
        outline: none;
        padding: 1rem;
        transition: all 200ms ease-in-out;
    }



    /*Fim da aréa de busca*/
</style>
